[project]
name = "appealpilot"
version = "0.1.0"
description = "Agentic copilot that turns a denied health-insurance claim into a cited, deadline-tracked appeal."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["appealpilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: the formatter owns line length (long letter templates are intentional).
# B008: File()/Form() defaults are the FastAPI idiom.
ignore = ["E501", "B008", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
