name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: appealpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[postgres,dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests (in-memory store)
        run: pytest -q
      - name: API tests (Postgres + pgvector)
        run: pytest -q tests/test_api.py
        env:
          DATABASE_URL: postgresql://postgres:pg@localhost:5432/appealpilot
      - name: Retrieval eval gate (offline, free)
        run: |
          python evals/run_eval.py --min-recall 0.9 --min-citation 0.9
          python evals/run_eval.py --split heldout
          python evals/run_challan_eval.py --min-exact 0.9
      - name: Claude agent eval (opt-in: set repo variable RUN_CLAUDE_EVAL=true and a funded key)
        if: vars.RUN_CLAUDE_EVAL == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python evals/run_eval.py --mode claude --split heldout

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
